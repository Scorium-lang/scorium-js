name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: typecheck + conformance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (dist/, verifies the published package actually compiles)
        run: npm run build

      - name: Conformance (31/31 scorium-spec fixtures)
        run: npm test

  publish:
    name: publish newer version to npm
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check whether this version is newer
        id: version
        shell: bash
        run: |
          package_name="$(node --print "require('./package.json').name")"
          package_version="$(node --print "require('./package.json').version")"

          set +e
          registry_output="$(npm view "${package_name}@>=${package_version}" version 2>&1)"
          registry_status=$?
          set -e

          if [ "$registry_status" -eq 0 ]; then
            echo "${package_name}@${package_version} is not newer than every published version; skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif grep -q "E404" <<< "$registry_output"; then
            echo "${package_name}@${package_version} is newer than every published version."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "$registry_output" >&2
            exit "$registry_status"
          fi

      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        run: npm publish --access public
