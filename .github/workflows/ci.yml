name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: typecheck + conformance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (dist/, verifies the published package actually compiles)
        run: npm run build

      - name: Tests and conformance (34/34 scorium-spec fixtures)
        run: npm test

  publish:
    name: publish newer version and create release
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check whether this version is newer
        id: version
        shell: bash
        run: |
          package_name="$(node --print "require('./package.json').name")"
          package_version="$(node --print "require('./package.json').version")"

          echo "package=$package_name" >> "$GITHUB_OUTPUT"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

          set +e
          newer_output="$(npm view "${package_name}@>${package_version}" version 2>&1)"
          newer_status=$?
          set -e

          if [ "$newer_status" -eq 0 ]; then
            echo "Refusing to publish ${package_name}@${package_version}; newer version(s) already exist: ${newer_output}" >&2
            exit 1
          elif ! grep -q "E404" <<< "$newer_output"; then
            echo "$newer_output" >&2
            exit "$newer_status"
          fi

          set +e
          exact_output="$(npm view "${package_name}@${package_version}" version 2>&1)"
          exact_status=$?
          set -e

          if [ "$exact_status" -eq 0 ]; then
            echo "${package_name}@${package_version} is already published; skipping npm publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            published_git_head="$(npm view "${package_name}@${package_version}" gitHead 2>/dev/null || true)"
            if [ "$published_git_head" = "$GITHUB_SHA" ]; then
              echo "The published package came from this commit; ensuring its GitHub Release exists."
              echo "release=true" >> "$GITHUB_OUTPUT"
            else
              echo "release=false" >> "$GITHUB_OUTPUT"
            fi
          elif grep -q "E404" <<< "$exact_output"; then
            echo "${package_name}@${package_version} is newer than every published version."
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "$exact_output" >&2
            exit "$exact_status"
          fi

      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        run: npm publish --access public

      - name: Create version tag and GitHub Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v${RELEASE_VERSION}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists; skipping."
            exit 0
          fi

          notes_file="${RUNNER_TEMP}/scorium-release-notes.md"
          if ! awk -v heading="## ${RELEASE_VERSION}" '
            index($0, heading) == 1 && (length($0) == length(heading) || substr($0, length(heading) + 1, 1) == " ") {
              found = 1
              next
            }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 2 }
          ' CHANGELOG.md > "$notes_file"; then
            echo "CHANGELOG.md has no section for ${RELEASE_VERSION}." >&2
            exit 1
          fi

          if ! grep --quiet '[^[:space:]]' "$notes_file"; then
            echo "CHANGELOG.md section for ${RELEASE_VERSION} is empty." >&2
            exit 1
          fi

          if tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq .object.sha 2>/dev/null)"; then
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "Refusing to release: $tag already points to $tag_sha, not $GITHUB_SHA." >&2
              exit 1
            fi
            gh release create "$tag" --verify-tag --title "scorium $tag" --notes-file "$notes_file"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "scorium $tag" --notes-file "$notes_file"
          fi
